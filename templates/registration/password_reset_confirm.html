{% extends "base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="flex items-center justify-center py-12">
  <div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      {% if validlink %}
        <h5 class="text-base font-bold text-blue-950">Nueva contraseña</h5>
        <form method="post" class="space-y-3">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="w-full bg-gradient-to-r from-blue-950 to-blue-800 text-white rounded-lg py-2.5 text-sm font-medium hover:from-blue-900 hover:to-blue-700 transition">Guardar</button>
        </form>
      {% else %}
        <p class="text-sm text-red-700">El enlace no es válido o ya expiró.</p>
        <a href="{% url 'password_reset' %}" class="inline-block px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-600 text-sm font-medium hover:bg-slate-100 transition">Solicitar otro</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
