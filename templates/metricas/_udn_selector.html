{% if udns|length > 1 %}
<div class="inline-flex items-center gap-2">
  <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide">UDN</label>
  <select onchange="cambiarUdn(this.value)"
          class="rounded-xl border border-white/60 bg-white/70 backdrop-blur px-3 py-2 shadow-sm text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-950 focus:border-blue-950">
    {% for u in udns %}
      <option value="{{ u.code }}" {% if u.code == udn %}selected{% endif %}>{{ u.nombre }} ({{ u.code }})</option>
    {% endfor %}
  </select>
</div>
{% else %}
<span class="text-sm font-semibold text-slate-600">UDN: <span class="text-blue-950">{{ udn }}</span></span>
{% endif %}
