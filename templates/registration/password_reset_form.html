{% extends "base.html" %}
{% block title %}Restablecer contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5">
  <div class="card p-4">
    <h5>Restablecer contraseña</h5>
    <p class="small text-muted">Escribe tu correo y te enviaremos un enlace para crear una nueva.</p>
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Correo</label>
        <input type="email" name="email" class="form-control" required></div>
      <button class="btn btn-primary w-100">Enviar enlace</button>
    </form>
  </div>
</div></div>
{% endblock %}
