{% extends "base.html" %}
{% block title %}Correo enviado{% endblock %}
{% block content %}
<div class="flex items-center justify-center py-12">
  <div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center space-y-4">
      <h5 class="text-base font-bold text-blue-950">Revisa tu correo</h5>
      <p class="text-sm text-slate-500">Si el correo existe, recibirás un enlace para restablecer tu contraseña.</p>
      <a href="{% url 'login' %}" class="inline-block px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-600 text-sm font-medium hover:bg-slate-100 transition">Volver a ingresar</a>
    </div>
  </div>
</div>
{% endblock %}
