{% extends "base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5">
  <div class="card p-4">
    {% if validlink %}
      <h5>Nueva contraseña</h5>
      <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100">Guardar</button>
      </form>
    {% else %}
      <p class="text-danger">El enlace no es válido o ya expiró.</p>
      <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary btn-sm">Solicitar otro</a>
    {% endif %}
  </div>
</div></div>
{% endblock %}
