{% extends "base.html" %}
{% block title %}Restablecer contraseña{% endblock %}
{% block content %}
<div class="flex items-center justify-center py-12">
  <div class="w-full max-w-sm">
    <form method="post" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      {% csrf_token %}
      <h5 class="text-base font-bold text-blue-950">Restablecer contraseña</h5>
      <p class="text-sm text-slate-500">Escribe tu correo y te enviaremos un enlace para crear una nueva.</p>
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
        <input type="email" name="email" id="email" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-950 focus:border-blue-950">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-blue-950 to-blue-800 text-white rounded-lg py-2.5 text-sm font-medium hover:from-blue-900 hover:to-blue-700 transition">Enviar enlace</button>
    </form>
  </div>
</div>
{% endblock %}
