services:
  web:
    build: .
    container_name: clientesd_web
    env_file: .env
    environment:
      DJANGO_ENV: prod
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - static:/app/staticfiles

  worker:
    build: .
    container_name: clientesd_worker
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DJANGO_ENV: prod
      POSTGRES_HOST: db
    depends_on:
      - db
      - redis

  beat:
    build: .
    container_name: clientesd_beat
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DJANGO_ENV: prod
      POSTGRES_HOST: db
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: clientesd_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clientesd}
      POSTGRES_USER: ${POSTGRES_USER:-clientesd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clientesd}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clientesd_redis

volumes:
  pgdata:
  static:
