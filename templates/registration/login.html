{% extends "base.html" %}
{% block title %}Ingresar · Portal Clientes{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card p-4">
      <h4 class="mb-3 text-center">Portal Clientes</h4>
      {% if form.errors %}<div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>{% endif %}
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">Ingresar</button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
      <div class="text-center mt-3 small">
        <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
